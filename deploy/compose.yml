name: botkit-leadgen

services:
  bot:
    image: "ghcr.io/ninelegsdog/botkit-leadgen:${IMAGE_TAG:?IMAGE_TAG is not set - deploy through botkit-monitoring ops/rollout/deploy_rollout.sh}"
    container_name: botkit-leadgen
    user: "1001:1001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      default:
        aliases:
          - botkit-leadgen
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - METRICS_PORT=${METRICS_PORT}
      - BIND_HOST=0.0.0.0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - WEBHOOK_SECRET_TOKEN=${TELEGRAM_WEBHOOK_SECRET}
      - WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_IDS=${ADMIN_IDS}
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=sqlite+aiosqlite:///./data/bot.db
      - DB_PATH=./data/bot.db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://host.docker.internal:4318/v1/traces
    ports:
      - "127.0.0.1:${METRICS_PORT}:${METRICS_PORT}"
    volumes:
      - ../data:/app/data
      - ../backups:/app/backups
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,socket; urllib.request.urlopen('http://127.0.0.1:${METRICS_PORT}/health',timeout=2); socket.create_connection(('redis',6379),5).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    restart: always
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g

networks:
  default:
    name: botkit_leadgen
    external: true
