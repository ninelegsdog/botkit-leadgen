[alembic]
# path to migration scripts
script_location = alembic

# database URL - will be overridden by code
sqlalchemy.url = sqlite:///data/leads.db

# version location
version_locations = alembic/versions

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = UTC

# max length of characters to apply to the
# "version code" column
version_code_length = 32

# template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# version type; can be "timestamp", "hex" or "auto"
version_type = hex

# the character set to use for the version code
version_code_characters = abcdef0123456789

# the naming style used for the version code
version_code_naming = snake

# Enable SQL output to stdout
sql.output = false

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-a-template-post-writing-hooks

hooks = tokens

[hooks.tokens]
type = console_scripts
entrypoint = alembic_autogenerate_hooks:replace_tokens

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
