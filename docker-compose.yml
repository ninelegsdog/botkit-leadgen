version: "3.8"

services:
  bot:
    image: botkit-leadgen:1.0.0
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8082:8082"
    read_only: true
    user: 1001:1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
