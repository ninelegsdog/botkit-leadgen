name: CI
on: [push, pull_request, workflow_call]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6.0.0
        with:
          python-version: "3.12"
      - name: Repository contract
        run: python3 scripts/check-repo-contract.py . scripts/repo-contract.json
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.13.0"
      - name: Lockfile must be current
        # Fails when pyproject.toml has moved and uv.lock has not been regenerated.
        # Without this gate the lockfile would rot silently and the "frozen" install
        # below would keep building last month's dependency set, pinned in green.
        run: uv lock --check
      - name: Install dependencies from the lockfile
        run: uv sync --frozen --all-extras
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src/
      - run: uv run --frozen pytest --run-integration --cov=src --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

      # Pre-commit checks
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v6.0.0
        with:
          python-version: "3.12"
      - name: Install pre-commit and gitleaks
        run: |
          pip install pre-commit
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_checksums.txt -o /tmp/gitleaks_checksums.txt
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          expected=$(awk -v f="gitleaks_8.18.0_linux_x64.tar.gz" '{n=$2; sub(/^\*/,"",n); if (n==f) print $1}' /tmp/gitleaks_checksums.txt)
          echo "$expected  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          mkdir -p /tmp/bin && mv /tmp/gitleaks /tmp/bin/
          echo "/tmp/bin" >> "$GITHUB_PATH"
      - name: Run pre-commit
        run: pre-commit run --all-files

      # Version drift check
      - name: Version drift check
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "Version not found in pyproject.toml"
            exit 1
          fi
          echo "Package version: $VERSION"
          echo "Version drift check passed for $VERSION"
      # Build the image so a broken Dockerfile fails here rather than on main.
      #
      # deploy.yml runs only on push to main, so without this the image was never built on
      # a PR: a broken Dockerfile merged green and then failed the deploy job after the
      # merge, where the only remedy is a revert. Same action SHAs as deploy.yml, so the
      # two workflows cannot drift apart.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.3.0
      - name: Validate image build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.3.0
        with:
          context: .
          push: false
          build-args: |
            BUILD_SHA=${{ github.sha }}

  # Офлайн-прогоны кейсов фермы по коду этого PR (botkit-farm → farm-smoke.yml).
  # Отдельный job, а не шаг в check: под ним заработает общий гейт, и его
  # падение не смешается с падением тестов бота в одном чеке.
  #
  # Ссылка на @main, а не на SHA: кейсы живут в ферме и меняются вместе с
  # дырами, которые закрывают, — пиннинг заморозил бы и проверку. Репозиторий
  # наш, публичный; ферма и есть источник правды для кейсов.
  farm-smoke:
    name: Ферма · офлайн-прогоны
    permissions:
      contents: read
    uses: ninelegsdog/botkit-farm/.github/workflows/farm-smoke.yml@main
    with:
      bot: leadgen


  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0
        with:
          fetch-depth: 0
      
      # Gitleaks
      # Gitleaks: gitleaks-action v3 (а) требует явный GITHUB_TOKEN для PR-сканов,
      # (б) проверку лицензии делает неаутентифицированным запросом к api.github.com -
      # на общих runner'ах тот ловит rate limit и роняет джоб с 'missing gitleaks license'.
      # Обязательный чек должен быть детерминированным, поэтому та же проверка
      # пинненной версией CLI, без обращений к API; SARIF уходит в code scanning.
      - name: Gitleaks scan
        run: |
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt -o /tmp/gitleaks_checksums.txt
          curl -sfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          expected=$(awk -v f="gitleaks_8.24.3_linux_x64.tar.gz" '{n=$2; sub(/^\*/,"",n); if (n==f) print $1}' /tmp/gitleaks_checksums.txt)
          echo "$expected  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --report-format sarif --report-path gitleaks.sarif
      - name: Upload Gitleaks results
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939  # v4.0.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: gitleaks.sarif
      
      # Trivy filesystem scan
      - name: Trivy filesystem scan
        run: |
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_checksums.txt -o /tmp/trivy_checksums.txt
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz -o /tmp/trivy.tgz
          expected=$(awk -v f="trivy_0.75.0_Linux-64bit.tar.gz" '{n=$2; sub(/^\*/,"",n); if (n==f) print $1}' /tmp/trivy_checksums.txt)
          echo "$expected  /tmp/trivy.tgz" | sha256sum -c -
          mkdir -p /tmp/trivybin && tar -xzf /tmp/trivy.tgz -C /tmp/trivybin trivy
          /tmp/trivybin/trivy fs --severity CRITICAL,HIGH --exit-code 1 --format sarif --output trivy-fs.sarif .
      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939  # v4.0.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-fs.sarif"
      
      # SBOM generation
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: "."
          format: "spdx-json"
          output-file: "sbom.spdx.json"
      - name: Publish SBOM to Dependency Graph
        uses: anchore/sbom-action/publish-sbom@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          sbom-artifact-match: "sbom.spdx.json"

  load-test:
    runs-on: ubuntu-latest
    needs: check
    if: false  # Manual only for now, k6 sanity 100 RPS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.0
      - name: Setup k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1  # v1  # v1
      - name: Validate k6 script
        run: k6 run --vus 1 --iterations 1 load-test.js --out /dev/null || echo "k6 script valid (no server, expected fail)"
